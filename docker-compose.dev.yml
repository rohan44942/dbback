version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  dbback:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbback
    depends_on:
      - minio
    environment:
      DBBACK_STORAGE_TYPE: s3
      DBBACK_STORAGE_ENDPOINT: minio:9000
      DBBACK_STORAGE_BUCKET: backups
      DBBACK_STORAGE_ACCESS_KEY: minioadmin
      DBBACK_STORAGE_SECRET_KEY: minioadmin
      DBBACK_SERVER_ADDR: ":8080"
    ports:
      - "8080:8080"
    volumes:
      - ./backups:/app/backups
      - ./metadata:/app/metadata
      - ./configs:/app/configs
volumes:
  minio_data:
